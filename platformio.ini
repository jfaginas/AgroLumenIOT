[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

# Configuración de Velocidades y Monitoreo
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0

# Configuración del estándar de C++ para enum class
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

# Gestión automática de Librerías
lib_deps =
    blynkkk/Blynk @ 1.3.2
    adafruit/Adafruit SSD1306 @ 2.5.13
    adafruit/Adafruit GFX Library @ 1.11.11
    adafruit/Adafruit AS7341 @ 1.4.1
    makuna/RTC @ 2.4.3